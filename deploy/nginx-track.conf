# nginx site for track.l3xj.com, on StarDestroyer.
#
# Install as /etc/nginx/sites-available/track and symlink into sites-enabled.
# Keep any backup in /etc/nginx/backups/, never inside sites-enabled/: the
# include there is `sites-enabled/*` with no extension filter, so a backup file
# would load as live configuration.
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# No new `map $http_upgrade $connection_upgrade` block belongs here — there is
# exactly one, in nginx.conf, and a second would fail the config test.

upstream track_backend {
    server 10.0.1.20:8470;
    keepalive 16;
}

# Port 80 is open and reachable, so this redirect block is required. Without it
# the name falls through to 00-catchall and plain HTTP returns 444 instead of
# redirecting.
server {
    listen 80;
    listen [::]:80;
    server_name track.l3xj.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name track.l3xj.com;

    ssl_certificate     /etc/letsencrypt/live/l3xj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l3xj.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This block defines its own add_header, which discards every add_header
    # inherited from the http block — HSTS included. It is repeated here for
    # that reason. Any future global header must be repeated here too.
    add_header Strict-Transport-Security "max-age=300" always;

    # The app is one person's private log. Keep it out of search indexes even
    # though every page already requires a session.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://track_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_read_timeout 60s;
    }
}
